# Database used by One23ApplicationTests (loaded with @TestPropertySource).
#
# Tests must NEVER touch the production Supabase database.
# - The host is fixed to localhost on purpose: there is no setting that can point it somewhere else.
# - @TestPropertySource has the highest priority in Spring Boot, so these values win over
#   .env, application.properties, environment variables and -D system properties.
#
# One-time setup: run PostgreSQL locally and create an empty database called one23_test.
# Flyway creates the tables on the first test run.
spring.datasource.url=jdbc:postgresql://localhost:${ONE23_TEST_DB_PORT:5432}/one23_test
spring.datasource.username=${ONE23_TEST_DB_USERNAME:postgres}
spring.datasource.password=${ONE23_TEST_DB_PASSWORD:postgres}
