spring.application.name=one23

# Local development: secrets live in the project root .env (copy .env.example). Start the app from the project root.
# Production: no .env file — the hosting platform provides the same names as environment variables.
spring.config.import=optional:file:.env[.properties]

server.port=${PORT:8080}

# ==================== Database ====================
spring.datasource.url=${ONE23_DATABASE_URL}
spring.datasource.username=${ONE23_DATABASE_USERNAME}
spring.datasource.password=${ONE23_DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# The schema is created by Flyway (db/migration). Hibernate only checks it matches the entities.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ==================== Flyway ====================
# baseline-on-migrate lets Flyway adopt a database whose tables already exist.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Baseline of schema created via ddl-auto=update prior to Flyway adoption

# ==================== JWT ====================
jwt.secret=${JWT_SECRET}
# 24 hours in milliseconds
jwt.expiration=86400000

# ==================== Login rate limiting ====================
# Applies to POST /api/auth/login, per client IP and per email (see LoginRateLimiter)
app.security.login-rate-limit.max-attempts=${ONE23_LOGIN_RATE_LIMIT_MAX_ATTEMPTS:5}
app.security.login-rate-limit.window-seconds=${ONE23_LOGIN_RATE_LIMIT_WINDOW_SECONDS:60}

# ==================== CORS ====================
# Comma-separated frontend origin patterns allowed to call the REST API and open /ws.
# Default allows any localhost port. In production use your exact frontend URL.
app.cors.allowed-origins=${ONE23_CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}

# ==================== Welcome email (Gmail SMTP) ====================
# If these are not set the app still starts; the welcome email just fails quietly.
spring.mail.host=${ONE23_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${ONE23_MAIL_PORT:587}
spring.mail.username=${ONE23_MAIL_USERNAME:}
spring.mail.password=${ONE23_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# "From" address of the welcome email (for Gmail it must equal the SMTP username)
app.mail.from=${ONE23_MAIL_USERNAME:noreply@one23.app}

# Where the "Login Now" button in the welcome email points
app.frontend.login-url=${ONE23_FRONTEND_LOGIN_URL:http://localhost:5173/login}
